services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dp_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"          # necesario para restaurar WideWorldImporters-Full
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1434:1433"   # 1434 para no chocar con un SQL Server ya instalado en Windows
    volumes:
      - sqldata:/var/opt/mssql
      - ./database/backups:/backups:ro
      - ./database/scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  sqldata: